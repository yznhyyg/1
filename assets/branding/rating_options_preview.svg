    <text x="1000" y="112" fill="#b6a6ff" font-size="22" font-weight="700">3 · SHARP NEON</text>
    <path d="M480 0H270Q250 0 250 20V240Q250 260 270 260H480Q500 260 500 240V20Q500 0 480 0Z" transform="translate(750 140)" fill="#0b1224" stroke="#b6a6ff" stroke-width="4" filter="url(#shadow)"/>
    <text x="1000" y="205" fill="#66e7da" font-size="22" font-weight="700">RATING</text>
    <text x="1000" y="300" fill="#fff" font-size="68" font-weight="700">0.637</text>
